name: jejum_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.1
  fl_chart: ^0.69.2
  cupertino_icons: ^1.0.8
  injectable: ^3.0.0
  collection: ^1.19.1
  uuid: ^4.6.0
  provider: ^6.1.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
    - assets/images/logo_icone.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.jpeg
  remove_alpha_ios: true
